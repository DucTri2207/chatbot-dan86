name: DAN86 Fanpage Bot 24-7 VPS

on:
  workflow_dispatch:
  schedule:
    # Watchdog tự động kiểm tra và giữ máy luôn chạy 24/24
    - cron: "*/30 * * * *"

# Đảm bảo tại mỗi thời điểm chỉ có duy nhất 1 con VPS chạy trực Page (khi gọi workflow_dispatch sẽ thay thế ca cũ ngay lập tức, không bị treo pending)
concurrency:
  group: dan86-fanpage-bot-singleton
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: write
  actions: write

jobs:
  truc-page-24-7:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: 1. Tải mã nguồn dự án
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Cài đặt Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 3. Cài đặt Playwright & Trình duyệt Chromium trên VPS Linux
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: 3b. Khôi phục phiên đăng nhập từ Cache (nếu có bản cập nhật mới nhất)
        uses: actions/cache/restore@v4
        with:
          path: |
            state/fb_storage_state.json
            state/GITHUB_SECRET_VALUE.txt
          key: fb-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fb-session-${{ runner.os }}-

      - name: 3c. Tự động kết nối OpenVPN Việt Nam (Tối ưu hạ tầng mạng & Tránh chặn IP quốc tế)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq openvpn curl || true
          python scripts/connect_vn_vpn.py || true
          curl -s https://ipinfo.io/json || true

      - name: 4. Chạy Bot Trực Fanpage DAN86 (Ca làm việc 5 tiếng 20 phút)
        env:
          FB_STORAGE_STATE: ${{ secrets.FB_STORAGE_STATE }}
          FB_EMAIL: ${{ secrets.FB_EMAIL }}
          FB_PASSWORD: ${{ secrets.FB_PASSWORD }}
          META_INBOX_URL: ${{ vars.META_INBOX_URL || 'https://business.facebook.com/latest/inbox/all?asset_id=104011958817512' }}
          META_MESSENGER_URL: ${{ vars.META_MESSENGER_URL || 'https://business.facebook.com/latest/inbox/messenger?asset_id=104011958817512' }}
          META_COMMENTS_URL: ${{ vars.META_COMMENTS_URL || 'https://business.facebook.com/latest/inbox/facebook?asset_id=104011958817512' }}
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          python 2_chay_bot_truc_page.py --headless --max-minutes 320

      - name: 5. Lưu bộ nhớ trạng thái hội thoại & tình trạng VPS sang ca sau
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          # 1. Cập nhật lại Secret FB_STORAGE_STATE lên GitHub nếu có phiên mới được làm mới
          if [ -f state/GITHUB_SECRET_VALUE.txt ]; then
            gh secret set FB_STORAGE_STATE -R "${{ github.repository }}" < state/GITHUB_SECRET_VALUE.txt || true
          fi

          # 2. Gọi module state_sync để Smart Merge bot_memory.json và push an toàn bằng Fast-Forward
          python -m bot.state_sync || true

          # 3. Kiểm tra dự phòng: Nếu còn commit dở dang chưa push, tiến hành push
          git config user.name "dan86-bot"
          git config user.email "bot@dan86.vn"
          git fetch origin master || true
          if git log origin/master..HEAD --oneline | grep -q .; then
            echo "Phát hiện commit chưa đẩy, đang đẩy lên origin/master..."
            git push origin HEAD:master || true
          fi

      - name: 5b. Lưu phiên đăng nhập đã làm mới vào Cache cho ca tiếp theo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/fb_storage_state.json
            state/GITHUB_SECRET_VALUE.txt
          key: fb-session-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 6. Tự động gọi Ca VPS tiếp theo nối đuôi 24/24
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run vps_bot_24_7.yml -R "${{ github.repository }}" || true

